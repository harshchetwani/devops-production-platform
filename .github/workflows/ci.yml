name: CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: orders_db
          POSTGRES_USER: order_user
          POSTGRES_PASSWORD: order_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U order_user -d orders_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://order_user:order_password@localhost:5432/orders_db
      APP_NAME: Order Management API
      APP_VERSION: 1.0.0
      APP_ENV: test

    defaults:
      run:
        working-directory: application

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          python -m app.init_db

      - name: Run tests
        run: |
          python -m pytest


  docker-build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t order-api:${{ github.sha }} \
            ./application

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: order-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/order-api:${{ github.sha }} \
            ./application

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/order-api:${{ github.sha }}


  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm/order-api

      - name: Helm template
        run: |
          helm template order-api helm/order-api > /tmp/order-api.yaml

      